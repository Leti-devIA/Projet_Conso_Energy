# ========================================
# Workflow CD - API Inference
# ========================================
# Ce workflow déploie l'API de prédiction (inference).
# Elle utilise les modèles Prophet entraînés.

name: CD - Déploiement API Inference

# Déclenchement :
# 1. Manuel via l'interface GitHub
# 2. Automatique si push sur main ET modification dans api/api-inference/
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - 'api/api-inference/**'
      - 'src/**'  # Si le code src change, redéployer l'API
      - '.github/workflows/cd-api-inference.yml'

jobs:
  # ========== JOB 1 : BUILD & DEPLOY ==========
  deploy:
    name: Build et déploiement
    runs-on: ubuntu-latest
    environment: production

    steps:
      # Étape 1 : Récupère le code
      - name: 📥 Récupérer le code
        uses: actions/checkout@v4

      # Étape 2 : Configure Docker Buildx
      - name: 🐳 Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Étape 3 : Connexion Docker Hub
      - name: 🔐 Connexion Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Étape 4 : Build l'image Docker de l'API Inference
      - name: 🏗️ Build Docker image
        working-directory: ./api/api-inference
        run: |
          # Crée l'image avec les modèles Prophet
          docker build -t ${{ secrets.DOCKER_USERNAME }}/api-inference:latest \
                       -t ${{ secrets.DOCKER_USERNAME }}/api-inference:${{ github.sha }} .

      # Étape 5 : Push vers Docker Hub
      - name: 📤 Push vers Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/api-inference:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/api-inference:${{ github.sha }}

      # Étape 6 : Déploiement
      - name: 🚀 Déployer sur serveur
        if: github.ref == 'refs/heads/main'
        run: |
          echo "🚀 Déploiement API Inference réussi !"
          echo "Image disponible : ${{ secrets.DOCKER_USERNAME }}/api-inference:latest"
          # TODO : Ajouter commande SSH
          # ssh user@server 'cd /app && docker-compose pull api-inference && docker-compose up -d api-inference'