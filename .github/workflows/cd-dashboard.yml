name: CD - Déploiement Dashboard

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - 'Modeles_TimesSeries/dashboard_app.py'
      - 'Modeles_TimesSeries/dashboard_demo.py'
      - 'Modeles_TimesSeries/requirements.txt'
      - 'Modeles_TimesSeries/tests/test_dashboard_*.py'
      - '.github/workflows/cd-dashboard.yml'

concurrency:
  group: cd-dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Qualité + package dashboards
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: Modeles_TimesSeries

    steps:
      - name: 📥 Récupérer le code
        uses: actions/checkout@v4

      - name: 🐍 Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: Modeles_TimesSeries/requirements.txt

      - name: 📦 Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest streamlit plotly httpx ruff flake8

      - name: 🧹 Lint dashboards
        run: |
          flake8 dashboard_app.py dashboard_demo.py --count --select=E9,F63,F7,F82 --show-source --statistics
          ruff check dashboard_app.py dashboard_demo.py tests/test_dashboard_*.py --ignore E501

      - name: 🧪 Tests dashboards
        run: |
          pytest tests/test_dashboard_app.py tests/test_dashboard_demo.py -v --tb=short --disable-warnings -m unit

      - name: 🧪 Smoke test Streamlit (dashboard_app)
        run: |
          timeout 20s streamlit run dashboard_app.py --server.headless true --server.port 8501 >/tmp/dashboard_app.log 2>&1 || true
          if grep -E "Traceback|ModuleNotFoundError|ImportError" /tmp/dashboard_app.log; then
            echo "❌ Erreur au démarrage dashboard_app"
            cat /tmp/dashboard_app.log
            exit 1
          fi
          echo "✅ dashboard_app OK"

      - name: 🧪 Smoke test Streamlit (dashboard_demo)
        run: |
          timeout 20s streamlit run dashboard_demo.py --server.headless true --server.port 8502 >/tmp/dashboard_demo.log 2>&1 || true
          if grep -E "Traceback|ModuleNotFoundError|ImportError" /tmp/dashboard_demo.log; then
            echo "❌ Erreur au démarrage dashboard_demo"
            cat /tmp/dashboard_demo.log
            exit 1
          fi
          echo "✅ dashboard_demo OK"

      - name: 📦 Créer artefact de release
        run: |
          mkdir -p dist/dashboard
          cp dashboard_app.py dist/dashboard/
          cp dashboard_demo.py dist/dashboard/
          cp requirements.txt dist/dashboard/
          if [ -f docker-compose.yml ]; then cp docker-compose.yml dist/dashboard/; fi
          if [ -d scripts ]; then cp -r scripts dist/dashboard/scripts; fi
          tar -czf dist/dashboard-release-${{ github.sha }}.tar.gz -C dist dashboard

      - name: 📤 Publier artefact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-release-${{ github.sha }}
          path: Modeles_TimesSeries/dist/dashboard-release-${{ github.sha }}.tar.gz
          retention-days: 30

  deploy:
    name: Déploiement serveur (SSH)
    runs-on: ubuntu-latest
    needs: release
    if: ${{ github.ref == 'refs/heads/main' }}
    environment: production

    steps:
      - name: 📥 Télécharger artefact
        uses: actions/download-artifact@v4
        with:
          name: dashboard-release-${{ github.sha }}
          path: ./release

      - name: 🚀 Déploiement SSH
        if: ${{ secrets.DASHBOARD_SSH_HOST != '' && secrets.DASHBOARD_SSH_USER != '' && secrets.DASHBOARD_SSH_KEY != '' && secrets.DASHBOARD_DEPLOY_PATH != '' }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DASHBOARD_SSH_HOST }}
          username: ${{ secrets.DASHBOARD_SSH_USER }}
          key: ${{ secrets.DASHBOARD_SSH_KEY }}
          source: "release/dashboard-release-${{ github.sha }}.tar.gz"
          target: ${{ secrets.DASHBOARD_DEPLOY_PATH }}

      - name: ♻️ Redémarrage service Streamlit
        if: ${{ secrets.DASHBOARD_SSH_HOST != '' && secrets.DASHBOARD_SSH_USER != '' && secrets.DASHBOARD_SSH_KEY != '' && secrets.DASHBOARD_DEPLOY_PATH != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DASHBOARD_SSH_HOST }}
          username: ${{ secrets.DASHBOARD_SSH_USER }}
          key: ${{ secrets.DASHBOARD_SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.DASHBOARD_DEPLOY_PATH }}"
            tar -xzf "dashboard-release-${{ github.sha }}.tar.gz"
            cd dashboard
            python3 -m venv .venv || true
            . .venv/bin/activate
            pip install -U pip
            pip install -r requirements.txt
            pkill -f "streamlit run dashboard_app.py" || true
            nohup streamlit run dashboard_app.py --server.headless true --server.port 8501 > streamlit.log 2>&1 &
            echo "✅ Dashboard déployé et redémarré"

      - name: ℹ️ Déploiement manuel (fallback)
        if: ${{ secrets.DASHBOARD_SSH_HOST == '' || secrets.DASHBOARD_SSH_USER == '' || secrets.DASHBOARD_SSH_KEY == '' || secrets.DASHBOARD_DEPLOY_PATH == '' }}
        run: |
          echo "ℹ️ Secrets SSH absents. Déploiement auto ignoré."
          echo "Ajoutez les secrets suivants pour activer le déploiement automatique :"
          echo "- DASHBOARD_SSH_HOST"
          echo "- DASHBOARD_SSH_USER"
          echo "- DASHBOARD_SSH_KEY"
          echo "- DASHBOARD_DEPLOY_PATH"