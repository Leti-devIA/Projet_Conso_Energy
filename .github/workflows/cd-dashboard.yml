name: CD - Dashboards

on:
  push:
    branches:
      - main
    paths:
      - 'Modeles_TimesSeries/dashboard_app.py'
      - 'Modeles_TimesSeries/dashboard_demo.py'
      - 'Modeles_TimesSeries/requirements.txt'
      - 'Modeles_TimesSeries/tests/test_dashboard*.py'
      - '.github/workflows/cd-dashboard.yml'

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.build.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: Modeles_TimesSeries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint dashboards
        working-directory: Modeles_TimesSeries
        run: |
          pip install pylint
          pylint dashboard_app.py dashboard_demo.py --disable=C0111,W0212 || true

      - name: Run dashboard tests
        working-directory: Modeles_TimesSeries
        run: pytest tests/test_dashboard_app.py tests/test_dashboard_demo.py -v -m dashboard

      - name: Build artifact
        id: build
        working-directory: Modeles_TimesSeries
        run: |
          VERSION=$(date +%Y%m%d_%H%M%S)
          ARTIFACT_NAME="dashboards_${VERSION}.tar.gz"
          tar -czf "$ARTIFACT_NAME" dashboard_app.py dashboard_demo.py requirements.txt data/ mlruns/ 2>/dev/null || \
          tar -czf "$ARTIFACT_NAME" dashboard_app.py dashboard_demo.py requirements.txt
          echo "artifact_name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboards-release
          path: Modeles_TimesSeries/${{ steps.build.outputs.artifact_name }}
          retention-days: 5

  deploy:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Check if secrets are configured
        id: check_secrets
        run: |
          if [ -z "${{ secrets.DASHBOARD_SSH_HOST }}" ] || \
             [ -z "${{ secrets.DASHBOARD_SSH_USER }}" ] || \
             [ -z "${{ secrets.DASHBOARD_SSH_KEY }}" ] || \
             [ -z "${{ secrets.DASHBOARD_DEPLOY_PATH }}" ]; then
            echo "⚠️  Secrets manquants : déploiement ignoré"
            echo "skip_deploy=true" >> $GITHUB_OUTPUT
          else
            echo "skip_deploy=false" >> $GITHUB_OUTPUT
          fi

      - name: Download artifact
        if: steps.check_secrets.outputs.skip_deploy == 'false'
        uses: actions/download-artifact@v4
        with:
          name: dashboards-release

      - name: Deploy via SSH
        if: steps.check_secrets.outputs.skip_deploy == 'false'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DASHBOARD_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H ${{ secrets.DASHBOARD_SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

          scp -i ~/.ssh/id_deploy \
            dashboards_*.tar.gz \
            ${{ secrets.DASHBOARD_SSH_USER }}@${{ secrets.DASHBOARD_SSH_HOST }}:${{ secrets.DASHBOARD_DEPLOY_PATH }}/

          ssh -i ~/.ssh/id_deploy \
            ${{ secrets.DASHBOARD_SSH_USER }}@${{ secrets.DASHBOARD_SSH_HOST }} \
            "cd ${{ secrets.DASHBOARD_DEPLOY_PATH }} && \
             tar -xzf dashboards_*.tar.gz && \
             pip install -r requirements.txt && \
             systemctl restart streamlit-dashboard || echo 'Service non trouvé'"

      - name: Post-deploy health check
        if: steps.check_secrets.outputs.skip_deploy == 'false'
        run: |
          sleep 5
          curl -f http://${{ secrets.DASHBOARD_SSH_HOST }}:8501/_stcore/health || \
          echo "⚠️  Health check échoué, vérifier le service"

      - name: Deployment skipped (secrets missing)
        if: steps.check_secrets.outputs.skip_deploy == 'true'
        run: echo "✅ CI passée, déploiement ignoré (pas de secrets SSH)"