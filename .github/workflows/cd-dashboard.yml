# ========================================
# Workflow CD - Dashboard Streamlit
# ========================================
# Ce workflow déploie le dashboard de visualisation.
# Le dashboard utilise Streamlit pour afficher les prédictions.

name: CD - Déploiement Dashboard

# Déclenchement :
# 1. Manuel
# 2. Automatique si modifications des dashboards
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - 'dashboard_*.py'  # Tous les fichiers dashboard
      - 'requirements.txt'
      - '.github/workflows/cd-dashboard.yml'

jobs:
  # ========== JOB 1 : BUILD & DEPLOY ==========
  deploy:
    name: Build et déploiement
    runs-on: ubuntu-latest
    environment: production

    steps:
      # Étape 1 : Récupère le code
      - name: 📥 Récupérer le code
        uses: actions/checkout@v4

      # Étape 2 : Configure Python
      - name: 🐍 Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Étape 3 : Installe les dépendances
      - name: 📦 Installer les dépendances
        run: |
          pip install -r requirements.txt
          pip install streamlit

      # Étape 4 : Test de lancement du dashboard
      - name: 🧪 Test du dashboard
        run: |
          # Vérifie que le dashboard se lance sans erreur
          timeout 10 streamlit run dashboard_app.py --server.headless true || true
          echo "✅ Dashboard testé"

      # Étape 5 : Build Docker (optionnel)
      - name: 🐳 Build image Docker (optionnel)
        if: hashFiles('Dockerfile') != ''
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/dashboard:latest .

      # Étape 6 : Déploiement
      - name: 🚀 Déployer Dashboard
        if: github.ref == 'refs/heads/main'
        run: |
          echo "🚀 Dashboard prêt pour déploiement !"
          echo "Commande pour lancer : streamlit run dashboard_app.py"
          # TODO : Déployer sur Streamlit Cloud ou serveur
          # Option 1 : Streamlit Cloud (gratuit)
          # Option 2 : SSH vers serveur et redémarrer le service