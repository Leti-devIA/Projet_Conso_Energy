name: Sync docs to shared repo

on:
  push:
    branches: ["main", "branch-ia"]
    paths:
      - 'Modeles_TimesSeries/docs/**'   # déclenche si les docs du projet changent
      - '**.md'

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo projet
        uses: actions/checkout@v4

      - name: Checkout repo documentation
        uses: actions/checkout@v4
        with:
          repository: LaetitiaProLacroix/Lacroix-dev-docs
          token: ${{ secrets.PAT_DOC_REPO }}
          path: shared-docs

      - name: Copier les docs
        run: |
          mkdir -p shared-docs/docs/projet-conso-energ
          rsync -av --delete \
            Modeles_TimesSeries/docs/ \
            shared-docs/docs/projet-conso-energ/

      - name: Commit & push
        run: |
          cd shared-docs
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "docs: sync Projet Conso Energ (${{ github.sha }})"
          git push