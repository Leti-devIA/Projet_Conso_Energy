# ========================================
# Workflow CI - Intégration Continue
# ========================================
name: CI - Tests et Validation

on:
  push:
    branches: ["main", "branch-ia"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  tests:
    name: Tests unitaires et lint
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupérer le code
        uses: actions/checkout@v4

      - name: 🐍 Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: Modeles_TimesSeries/requirements.txt

      - name: 📦 Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r Modeles_TimesSeries/requirements.txt
          pip install pytest pytest-cov ruff flake8

      - name: 🧹 Vérification code (lint)
        run: |
          flake8 Modeles_TimesSeries/src/ --count --select=E9,F63,F7,F82 --show-source --statistics
          ruff check Modeles_TimesSeries/src/ Modeles_TimesSeries/tests/ --ignore E501 || true

      - name: 🧪 Lancer les tests
        run: |
          pytest Modeles_TimesSeries/tests/ -v --cov=Modeles_TimesSeries/src --cov-report=term --maxfail=1 --disable-warnings

      - name: 📊 Rapport de couverture
        if: always()
        run: |
          echo "✅ Tests terminés !"