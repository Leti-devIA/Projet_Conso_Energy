# ========================================
# Workflow CI - Intégration Continue
# ========================================
# Ce workflow s'exécute automatiquement à chaque push/PR
# pour vérifier que le code est propre et que les tests passent.

name: CI - Tests et Validation

# Déclenchement : à chaque push ou PR sur main/develop
on:
  push:
    branches: ["main", "branch-ia"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  PROJECT_DIR: Modeles_TimesSeries

jobs:
  # ========== JOB 1 : TESTS ==========
  tests:
    name: Tests unitaires et lint
    runs-on: ubuntu-latest  # Machine virtuelle Ubuntu

    steps:
      # Étape 1 : Récupère le code du repo
      - name: 📥 Récupérer le code
        uses: actions/checkout@v4

      # Étape 2 : Installe Python 3.11
      - name: 🐍 Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: Modeles_TimesSeries/requirements.txt

      # Étape 3 : Installe les dépendances du projet
      - name: 📦 Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r Modeles_TimesSeries/requirements.txt
          pip install pytest pytest-cov ruff

      # Étape 4 : Vérifie la qualité du code (linting)
      - name: 🧹 Vérification code (lint)
        run: |
          # Flake8 : détecte les erreurs de style Python
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Ruff : linter moderne et rapide (optionnel)
          ruff check src/ tests/ --ignore E501 || true

      # Étape 5 : Lance les tests unitaires
      - name: 🧪 Lancer les tests
        run: |
          # Pytest avec couverture de code
          pytest tests/ -v --cov=src --cov-report=term --maxfail=1 --disable-warnings

      # Étape 6 : Affiche un résumé de la couverture
      - name: 📊 Rapport de couverture
        if: always()  # S'exécute même si les tests échouent
        run: |
          echo "✅ Tests terminés !"