# ========================================
# Workflow CI - Intégration Continue
# ========================================
name: CI - Tests et Validation

on:
  push:
    branches: ["main", "branch-ia"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  tests:
    name: Tests unitaires et lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Modeles_TimesSeries  # ← TOUT s'exécute depuis ici

    steps:
      - name: 📥 Récupérer le code
        uses: actions/checkout@v4

      - name: 🐍 Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: Modeles_TimesSeries/requirements.txt

      - name: 📦 Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff flake8
          # Streamlit requis pour les tests dashboard (mocké, mais doit être importable)
          pip install streamlit httpx plotly || true

      - name: 🧹 Vérification code (lint)
        run: |
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
          ruff check src/ tests/ --ignore E501 || true
          # Lint des dashboards (erreurs fatales uniquement)
          flake8 dashboard_app.py dashboard_demo.py --count --select=E9,F63,F7,F82 --show-source --statistics || true

      - name: 🧪 Lancer les tests unitaires (src)
        run: |
          pytest tests/ -v --cov=src --cov-report=term --maxfail=5 --disable-warnings \
            -m "not integration and not requires_data and not slow"

      - name: 📊 Tests dashboard_app
        run: |
          pytest tests/test_dashboard_app.py -v --tb=short --disable-warnings \
            -m "unit" || true

      - name: 📊 Tests dashboard_demo
        run: |
          pytest tests/test_dashboard_demo.py -v --tb=short --disable-warnings \
            -m "unit" || true

      - name: 📊 Rapport de couverture
        if: always()
        run: |
          echo "✅ Tests terminés !"