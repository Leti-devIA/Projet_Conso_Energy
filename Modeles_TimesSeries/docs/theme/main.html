<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% if page and page.title %}{{ page.title }} - {% endif %}{{ config.site_name }}</title>
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; margin: 0; background: #fafafa; color: #1f2937; }
      header { background: #ffffff; border-bottom: 1px solid #e5e7eb; padding: 12px 20px; }
      main { max-width: 960px; margin: 24px auto; background: #ffffff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 24px; }
      h1, h2, h3 { color: #111827; }
      a { color: #2563eb; text-decoration: none; }
      a:hover { text-decoration: underline; }
      code { background: #f3f4f6; padding: 2px 5px; border-radius: 4px; }
      pre code { display: block; padding: 12px; overflow-x: auto; }
      nav a { margin-right: 12px; }
    </style>
  </head>
  <body>
    <header>
      <strong>{{ config.site_name }}</strong>
      <nav style="margin-top: 8px;">
        {% if nav %}
          {% for item in nav %}
            <a href="{{ item.url|url }}">{{ item.title }}</a>
          {% endfor %}
        {% endif %}
      </nav>
    </header>

    <main>
      {{ page.content }}
    </main>
  </body>
</html>
