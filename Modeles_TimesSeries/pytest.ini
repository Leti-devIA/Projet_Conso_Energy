[pytest]
# Configuration pytest pour le projet Prophet Energy Forecast

# Chemin de base des tests
testpaths = tests

# Patterns de fichiers de test
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Options de sortie verbale
addopts =
    -v
    --strict-markers
    --tb=short
    --capture=no
    -ra

# Coverage
# À ajouter : --cov=src --cov-report=html

# Markers personnalisés
markers =
    slow: tests lents (déselectionner avec -m "not slow")
    integration: tests d'intégration
    unit: tests unitaires
    requires_data: tests nécessitant les fichiers de données
